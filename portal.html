<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Rent - Sanefi Rent App</title>
<link rel="stylesheet" href="app-style.css">
</head>
<body>

<header class="app-header">
  <h1 id="tenant-header">My Rent</h1>
  <div class="header-actions">
    <button class="icon-btn" id="notif-btn" aria-label="Notifications">&#128276;</button>
    <button class="logout-btn" id="logout-btn">Log Out</button>
  </div>
  <div class="notif-panel" id="notif-panel"></div>
</header>

<div class="app-container">
  <div id="pending-notice"></div>

  <div id="rent-status-card"></div>

  <div id="lease-deposit-card"></div>

  <div class="card">
    <div class="card-title">Submit a Payment</div>
    <div class="card-sub" style="margin-bottom:14px;">Paste the full M-Pesa confirmation message you received after paying rent.</div>
    <form id="payment-form">
      <div class="field">
        <textarea name="message" placeholder="e.g. RK7X8Y9Z1A Confirmed. Ksh15,000.00 sent to..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-payment-btn">Submit Payment</button>
      <p class="alert alert-error" id="payment-error" style="display:none;"></p>
      <p class="alert alert-success" id="payment-success" style="display:none;"></p>
    </form>
  </div>

  <h3 style="margin-bottom:8px;">Payment History</h3>
  <div class="card" id="history-card">
    <p class="empty-state">Loading&hellip;</p>
  </div>

  <h3 style="margin-bottom:8px;">Maintenance Requests</h3>
  <div id="maintenance-list">
    <p class="empty-state">Loading&hellip;</p>
  </div>
  <div class="card">
    <div class="card-title">Report an Issue</div>
    <div class="card-sub" style="margin-bottom:14px;">Let the office know about a repair or maintenance issue in your unit.</div>
    <form id="maintenance-form">
      <div class="field">
        <label>Category</label>
        <select name="category" required>
          <option value="Plumbing">Plumbing</option>
          <option value="Electrical">Electrical</option>
          <option value="Structural">Structural</option>
          <option value="Appliance">Appliance</option>
          <option value="Pest Control">Pest Control</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea name="description" placeholder="Describe the issue..." required></textarea>
      </div>
      <button type="submit" class="btn btn-outline" id="submit-maintenance-btn">Submit Request</button>
      <p class="alert alert-error" id="maintenance-error" style="display:none;"></p>
      <p class="alert alert-success" id="maintenance-success" style="display:none;"></p>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-role.js"></script>
<script src="mpesa-parser.js"></script>
<script src="notifications.js"></script>
<script src="portal.js"></script>
</body>
</html>
